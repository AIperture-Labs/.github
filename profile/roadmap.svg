<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img" aria-label="AIperture Labs roadmap" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="48" x2="832" y1="0" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".55"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#1b2333" stroke-width="1"/></pattern>
  <clipPath id="card"><rect width="880" height="292" rx="16"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
  .spin { animation: spin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .flow { animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .scan { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateX(-120px); } to { transform: translateX(1000px); } }
</style>
<g clip-path="url(#card)">
  <rect width="880" height="292" fill="#0b0f17"/>
  <rect width="880" height="292" fill="url(#grid)" opacity=".7"/>
  <rect class="scan" x="0" y="0" width="120" height="292" fill="url(#beam)" opacity=".035"/>
</g>
<rect x=".5" y=".5" width="879" height="291" rx="15.5" fill="none" stroke="#243047"/>
<text x="32" y="44" class="mono" font-size="11" letter-spacing="3" fill="#38bdf8">// ROADMAP</text>
<text x="32" y="72" class="sans" font-size="22" font-weight="600" fill="#e6edf3">AIperture Labs</text>
<text x="848" y="44" class="mono" font-size="11" fill="#5b6b85" text-anchor="end">updated 2026-11-05</text>
<line x1="126.4" y1="150" x2="753.6" y2="150" stroke="#243047" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
<line x1="126.4" y1="150" x2="126.4" y2="150" stroke="url(#beam)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" opacity=".8"/>
<line x1="126.4" y1="150" x2="126.4" y2="150" stroke="url(#beam)" stroke-width="2" stroke-linecap="round"/>
<line class="flow" x1="126.4" y1="150" x2="126.4" y2="150" stroke="#e0f2fe" stroke-width="2" stroke-dasharray="4 24" stroke-linecap="round" opacity=".8"/>

<circle class="pulse" cx="126.4" cy="150" r="24" fill="url(#halo)"/><circle class="spin" cx="126.4" cy="150" r="17" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-dasharray="22 85"/><circle cx="126.4" cy="150" r="11" fill="#0b0f17" stroke="#7dd3fc" stroke-width="2.5"/><circle cx="126.4" cy="150" r="4.5" fill="#7dd3fc"/>
